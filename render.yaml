services:
  - type: web
    name: roz-roz-api
    runtime: python
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.migrate && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: roz-roz-db
          property: connectionString
      - key: USE_STUBS
        value: "true"
databases:
  - name: roz-roz-db
    region: singapore
