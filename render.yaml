# Backend web service. The Postgres database was created separately in the Render dashboard:
# set DATABASE_URL to its Internal Database URL (copied as-is; the app adds the psycopg driver).
services:
  - type: web
    name: roz-roz-api
    runtime: python
    region: singapore
    plan: starter # Free instances sleep after ~15 min idle and WhatsApp webhooks time out while they wake
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.migrate && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: USE_STUBS
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: TOOLS_TOKEN
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_ACCESS_TOKEN
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: WA_VERIFY_TOKEN
        generateValue: true
      - key: WA_BUSINESS_NUMBER
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: AGENT_RUNTIME
        value: "off"
      - key: DEMO_HELPER_E164
        sync: false
